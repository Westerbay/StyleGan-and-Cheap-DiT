variables:
  CONTAINER_IMAGE: "$CI_REGISTRY_IMAGE/$CI_PROJECT_NAME"
  CONTAINER_IMAGE_TAGGED: "$CONTAINER_IMAGE:$CI_COMMIT_SHA"
  CONTAINER_IMAGE_RELEASE: "$CONTAINER_IMAGE:v0.$CI_PIPELINE_IID"
  RELEASE: "v0.$CI_PIPELINE_IID"

stages:
  - deploy
  - release

docker_build:
  stage: deploy
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - docker build -t "$CONTAINER_IMAGE_TAGGED" -t "$CONTAINER_IMAGE_RELEASE" .
    - docker push "$CONTAINER_IMAGE_TAGGED"
    - docker push "$CONTAINER_IMAGE_RELEASE"

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: docker_build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      release-cli create \
        --name "Release $RELEASE" \
        --tag-name "$RELEASE" \
        --ref "$CI_COMMIT_SHA" \
        --description "🐳 Docker image: $CONTAINER_IMAGE_RELEASE"
