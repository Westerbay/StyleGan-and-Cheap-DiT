name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs fsck && python scripts/check_models.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/westerbay/stylegan-and-cheap-dit
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stylegan-smoke:local
      - name: Smoke test container and UI proxy
        run: |
          docker run -d --name smoke -p 5173:5173 stylegan-smoke:local
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5173/api/openapi.json > /tmp/openapi.json; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5173/ > /dev/null
          python -c 'import json; assert "/start" in json.load(open("/tmp/openapi.json"))["paths"]'
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `Release ${tag}`,
                body: `Container image: \`ghcr.io/westerbay/stylegan-and-cheap-dit:${tag}\``,
                generate_release_notes: true
              });
            }
